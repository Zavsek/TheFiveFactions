name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: frontend/coverage/**
          if-no-files-found: error

  build:
    name: Build & Cache
    runs-on: ubuntu-latest
    needs: [lint, test]
    environment: production
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js modular monolith
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://kjseykehsnbgzstivmyl.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_WNFML16cjligAGl25DDmk76k' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_jXKLvUTDCcblTmoLSxnfeARDjpwA' }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && { [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; }; then
            npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            npx vercel build --prod --token="$VERCEL_TOKEN"
          else
            npm run build
          fi

      - name: Archive build output (preserving symlinks)
        run: |
          EXTRA_PATHS=""
          if [ -d ".vercel/output" ]; then
            EXTRA_PATHS=".vercel/output .vercel/project.json"
          fi
          tar --exclude='.next/cache' -czf build-artifact.tar.gz .next public package.json package-lock.json next.config.ts $EXTRA_PATHS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: the-five-factions-build
          path: frontend/build-artifact.tar.gz
          if-no-files-found: error

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://the-five-factions.vercel.app
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: the-five-factions-build
          path: frontend

      - name: Extract Build Artifacts (preserving symlinks)
        run: |
          tar -xzf build-artifact.tar.gz
          rm -f build-artifact.tar.gz
          REAL_FUNCS=$(find .vercel/output/functions -name "*.func" -type d | wc -l)
          SYMLINK_FUNCS=$(find .vercel/output/functions -name "*.func" -type l | wc -l)
          echo "Real Serverless Functions: $REAL_FUNCS, Symlinked route aliases: $SYMLINK_FUNCS"

      - name: Deploy Prebuilt Application to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_WNFML16cjligAGl25DDmk76k' }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_jXKLvUTDCcblTmoLSxnfeARDjpwA' }}
        run: |
          npx vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN"
